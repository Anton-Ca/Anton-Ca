<svg xmlns="http://www.w3.org/2000/svg" width="53" height="20" role="img">
  <defs>
    <linearGradient id="smooth" x2="0" y2="100%">
      <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
      <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
  </defs>

  <rect rx="3" width="53" height="20" fill="#150458"/>
  <rect rx="3" width="20" height="20" fill="#150458"/>

  <!-- C# icon (moved up 1px) -->
  <g transform="translate(3,2) scale(0.045)">

    <!-- Larger centered hexagon -->
    <path d="
      M222 60
      L332 120
      L332 240
      L222 300
      L112 240
      L112 120
      Z"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="20"
      stroke-linejoin="round"/>

    <!-- More curved C arc -->
    <path d="M227 115 A100 70 0 0 0 215 245"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="22"
          stroke-linecap="round"/>

    <!-- # symbol inside hexagon -->
    <rect x="235" y="135" width="16" height="90" fill="#FFFFFF"/>
    <rect x="265" y="135" width="16" height="90" fill="#FFFFFF"/>
    <rect x="220" y="165" width="80" height="16" fill="#FFFFFF"/>
    <rect x="220" y="195" width="80" height="16" fill="#FFFFFF"/>

  </g>

  <text x="28" y="14" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">C#</text>
  <rect rx="3" width="53" height="20" fill="url(#smooth)"/>
</svg>
