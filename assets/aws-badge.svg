<svg xmlns="http://www.w3.org/2000/svg" width="140" height="20" role="img">
  <linearGradient id="smooth" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>

  <!-- Full badge background -->
  <rect rx="3" width="102" height="20" fill="#232F3E"/>

  <!-- Left icon block (20px wide, shields standard) -->
  <rect rx="3" width="20" height="20" fill="#232F3E"/>

  <!-- AWS logo scaled to fit 20px block -->
  <g transform="translate(3,3) scale(0.35)">
    <text x="10" y="25" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF">AWS</text>
    <path d="M10 18 C20 24,40 24,55 18" stroke="#FF9900" stroke-width="2" fill="none"/>
    <path d="M55 18 L52 15 L58 16 Z" fill="#FF9900"/>
  </g>

  <!-- Badge text (shields proportions) -->
  <text x="28" y="14" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">
    Amazon AWS
  </text>

  <!-- Gloss overlay -->
  <rect rx="3" width="140" height="20" fill="url(#smooth)"/>
</svg>
