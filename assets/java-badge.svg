<svg xmlns="http://www.w3.org/2000/svg" width="102" height="20" role="img">
  <defs>
    <linearGradient id="smooth" x2="0" y2="100%">
      <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
      <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
  </defs>

  <!-- Full badge background -->
  <rect rx="3" width="102" height="20" fill="#150458"/>

  <!-- Left icon block -->
  <rect rx="3" width="20" height="20" fill="#150458"/>

  <!-- Java logo -->
  <g transform="translate(1,3) scale(0.045)">
    <!-- Curved steam strokes -->
    <path fill="#F89820"
          d="M150 -10c-28 40 48 50 48 92s-36 64-36 64 26-22 26-58-44-48-38-98z"/>
    <path fill="#F89820"
          d="M190 0c-20 34 52 44 52 78s-34 58-34 58 22-20 22-52-40-44-40-84z"/>

    <!-- Cup body -->
    <path fill="#FFFFFF"
          d="M140 180h120c16 0 24 8 24 20s-8 20-24 20h-120c-16 0-24-8-24-20s8-20 24-20z"/>

    <!-- Cup inner cut -->
    <path fill="#150458"
          d="M150 188h100c10 0 16 6 16 12s-6 12-16 12h-100c-10 0-16-6-16-12s6-12 16-12z"/>

    <!-- Saucer -->
    <path fill="#FFFFFF"
          d="M130 232h140c18 0 26 8 26 16s-8 16-26 16h-140c-18 0-26-8-26-16s8-16 26-16z"/>

    <!-- Base -->
    <path fill="#FFFFFF"
          d="M150 276h100c14 0 22 8 22 16s-8 16-22 16h-100c-14 0-22-8-22-16s8-16 22-16z"/>

    <!-- Stem -->
    <rect x="196" y="168" width="8" height="20" fill="#FFFFFF"/>

    <!-- Handle: moved exactly 1px left (≈22 units), same shape/thickness/size -->
    <path d="M305 225 A32 32 0 0 1 305 295"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="18"
          stroke-linecap="round"/>
  </g>

  <!-- Badge text -->
  <text x="28" y="14" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">
    Java
  </text>

  <!-- Gloss overlay -->
  <rect rx="3" width="102" height="20" fill="url(#smooth)"/>
</svg>
